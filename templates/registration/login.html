{% extends "base.html" %}

{% block title %}Log in | CampusConnect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">
            <div class="text-center mb-4">
                <p class="text-uppercase text-muted mb-2" style="letter-spacing: 0.12em; font-size: 0.72rem;">Welcome back</p>
                <h2 class="h3 mb-0" style="letter-spacing: -0.04em; font-weight: 700;">Log in</h2>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "includes/form_fields.html" %}
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="notion-btn primary w-100 mt-2">Log in</button>
            </form>
            <p class="text-center mt-3 mb-0 text-muted">
                No account? <a href="{% url 'signup' %}" class="fw-semibold" style="color: var(--text);">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
