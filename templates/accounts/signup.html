{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="page-kicker"><span class="kicker-dot" aria-hidden="true"></span> YOUR CYCLE, YOUR WAY</div>
  <h1 class="page-title">Create your account</h1>
  <p class="page-intro">Get an early heads-up before your next cycle.</p>
  <hr class="page-divider">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/form_fields.html" with form=form %}
    <button type="submit" class="btn btn-cp px-4">Create account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{% url 'login' %}" class="link-cp">Log in</a></p>
</div>
{% endblock %}
